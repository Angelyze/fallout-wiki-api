<!-- Replace BOTH old AI chat scripts with this script (wiki page and widget).
     Keep their HTML and CSS. It is safe to include this script in both places.
     Set the same public production /api/chat URL in both copies. -->
<script>
(() => {
  if (window.__falloutHubChatLoaded) return;
  window.__falloutHubChatLoaded = true;
  const PROXY_URL = 'https://YOUR-PRODUCTION-DOMAIN.vercel.app/api/chat';

  function escapeHTML(text) {
    return text.replace(/[&<>"']/g, char => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    })[char]);
  }

  function formatMessage(message) {
    return escapeHTML(message)
      .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
      .replace(/\*(.*?)\*/g, '<em>$1</em>')
      .replace(/`(.*?)`/g, '<code>$1</code>')
      .replace(/\n/g, '<br>');
  }

  function initialize() {
    // Both live chats use the same element IDs. Scope each lookup to its chat.
    document.querySelectorAll('[id="chat-messages"]').forEach(chatMessages => {
      const root = chatMessages.closest('#chat-widget, .chat-container');
      if (!root) return;
      const userInput = root.querySelector('[id="user-input"]');
      const loading = root.querySelector('[id="loading"]');
      const sendButton = root.querySelector('[onclick*="sendMessage"]');
      if (!userInput || !sendButton) return;
      const isWidget = root.id === 'chat-widget';
      let pending = false;
      let greeted = false;
      userInput.maxLength = 6000;

      function displayMessage(message, fromUser = false) {
        const div = document.createElement('div');
        div.className = 'message ' + (fromUser ? 'user-message' : 'ai-message');
        if (isWidget) {
          div.style.cssText = 'border-left:3px solid #ff9000;padding:5px;margin:5px 0;font-size:14px;';
          div.style.background = fromUser ? '#111111' : '#222222';
        }
        if (fromUser) {
          div.textContent = message;
          div.style.whiteSpace = 'pre-wrap';
        } else {
          div.innerHTML = formatMessage(message);
        }
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
      }

      function greet() {
        if (greeted) return;
        greeted = true;
        displayMessage('Greetings, Wastelander! Ask me anything about the Fallout universe.');
      }

      async function sendMessage() {
        const message = userInput.value.trim();
        if (!message || pending) return;
        pending = true;
        sendButton.disabled = true;
        displayMessage(message, true);
        userInput.value = '';
        if (loading) {
          loading.style.display = 'block';
          loading.setAttribute('aria-hidden', 'false');
        }
        const controller = new AbortController();
        const timeout = setTimeout(() => controller.abort(), 55000);
        try {
          const response = await fetch(PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ message }),
            signal: controller.signal
          });
          const data = await response.json();
          displayMessage(response.ok && typeof data.reply === 'string'
            ? data.reply
            : 'Error accessing the archives: ' + (data.error || 'Please try again later.'));
        } catch {
          displayMessage('Connection lost or the archives took too long to respond. Please retry.');
        } finally {
          clearTimeout(timeout);
          pending = false;
          sendButton.disabled = false;
          if (loading) {
            loading.style.display = 'none';
            loading.setAttribute('aria-hidden', 'true');
          }
        }
      }

      sendButton.removeAttribute('onclick');
      sendButton.addEventListener('click', event => { event.preventDefault(); sendMessage(); });
      userInput.addEventListener('keydown', event => {
        if (event.key === 'Enter' && !event.shiftKey && !event.isComposing) {
          event.preventDefault();
          sendMessage();
        }
      });

      if (isWidget) {
        const icon = document.getElementById('chat-icon');
        const close = root.querySelector('[id="close-chat"]');
        icon?.addEventListener('click', () => {
          root.style.display = 'block';
          icon.style.display = 'none';
          chatMessages.style.maxHeight = Math.max(100, window.innerHeight - 150) + 'px';
          greet();
        });
        close?.addEventListener('click', () => {
          root.style.display = 'none';
          if (icon) icon.style.display = 'block';
        });
      } else {
        greet();
      }
    });
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', initialize, { once: true });
  else initialize();
})();
</script>
